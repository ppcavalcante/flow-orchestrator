name: CI

on:
  push:
    branches: [ anvil-m1, main ]
  pull_request:
  schedule:
    # Nightly at 04:17 UTC — carries the heavy, non-blocking mutation job (AUD-050)
    # off the every-PR hot path onto a scheduled cadence, so a slow mutation run
    # cannot delay a PR or (on its 6h GitHub default) cancel the whole workflow.
    - cron: '17 4 * * *'

permissions:
  contents: read

# GOTOOLCHAIN=local (AUD-051): go.mod carries `toolchain go1.25.11` so a
# CONTRIBUTOR on GOTOOLCHAIN=auto is nudged to the patched toolchain. In CI the
# Go version is pinned EXPLICITLY per job via setup-go, so `local` keeps that pin
# authoritative and stops the directive from silently auto-upgrading the 1.25.0
# matrix arm — which exists precisely to test the language floor, not 1.25.11.
env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.25.0 = the go.mod floor (lowest supported) — RAISED from 1.24 in M15:
        # modernc.org/sqlite v1.53.0's own go.mod requires `go 1.25.0`, so our module
        # directive is now `go 1.25.0` and a 1.24 toolchain can no longer build it.
        # 1.25.11 = the release/build toolchain, pinned to a patched release (>=1.25.11,
        # the govulncheck stdlib-advisory ceiling) — see DEC-M5-toolchain. Testing both
        # arms preserves cross-toolchain coverage (det-tax alloc counts drift across Go
        # minor versions; the det-tax calibration is go1.25-consistent so a 1.25.0 floor
        # arm is clean).
        go: [ '1.25.0', '1.25.11' ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
      - name: Generate FlatBuffers code
        run: make generate-fb
      - name: Build
        run: go build -v ./...
      - name: Pure-Go build (CGO_ENABLED=0, BLOCKING)
        # The pure-Go / zero-CGo embeddable moat is now load-bearing on the M15
        # SQLite dep (modernc.org/sqlite is pure-Go). A CGo regression — a new dep or
        # import that needs a C toolchain — must redden a merge, or the "builds
        # anywhere with no cgo" claim silently rots. Also cross-compile to a non-host
        # target to catch a host-only assumption. (Mirrors the det-tax blocking step.)
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt (fail if any file is unformatted)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test (race)
        # -timeout 30m: the full -race suite is heavy; a rare intermittent full-run has
        # approached go's default 600s -timeout (F-VERIFY-P112-FLAKE — zero data race,
        # suite weight). Explicit headroom keeps CI from stranding on the aggregate
        # timeout while staying a hard ceiling on a genuine hang.
        run: go test ./... -race -timeout 30m
      - name: det-tax ceiling (non-race, BLOCKING)
        # The zero-determinism-tax alloc ceiling (TestPerfCeiling_DetTax) measures
        # allocs via testing.Benchmark().AllocsPerOp(), which the race detector inflates
        # — so it SKIPS under the -race step above. This dedicated non-race step keeps the
        # moat guard BLOCKING on amd64 CI (the exact arch-specific alloc delta a local
        # arm64 run cannot see — M14 ph60 removed one alloc, read only on amd64). Runs on
        # BOTH toolchain arms. GOGC=800 (belt-and-suspenders with the in-test
        # debug.SetGCPercent(800)) keeps a loaded runner's GC from evicting the per-drive
        # sync.Pool mid-measurement and counting a MISS as a spurious +1 alloc — the det-tax
        # load-sensitivity that false-reddened this gate on 2026-08-12.
        run: GOGC=800 go test -run '^TestPerfCeiling_DetTax$' ./pkg/workflow
      # AUD-002 retired the `adversarial_copyclass` tag and its dedicated CI step. The tag existed
      # ONLY to quarantine `go vet`'s copylocks diagnostic on `cp := *dag`, which was the first half
      # of the copied-mutex-wedge finding. The fix makes DAG.mu a *sync.RWMutex: a value copy no
      # longer trips copylocks AND no longer inherits a locked mutex, so the diagnostic is gone and
      # the copy-class tests moved into the default build (seal_adversarial_117_copyclass_test.go),
      # covered by the ordinary `go test` / `-race` steps above. There is nothing tag-specific left
      # to run.
      - name: govulncheck (symbol-scan blocking)
        # Scoped to the 1.25.11 (release/build) toolchain ON PURPOSE — do NOT
        # un-scope this. A stdlib-advisory gate must reflect the toolchain we
        # actually RELEASE with (1.25.11, govulncheck-clean), not the EOL 1.24
        # floor arm: 1.24 is out of Go's support window, and the called stdlib
        # advisory GO-2026-4602 (os.ReadDir) has NO 1.24 backport (fixed only in
        # go1.25.8/1.26.1), so running this on 1.24.x is a PERMANENT false red.
        # The 1.24.x arm still gets full build/vet/gofmt/test-race floor
        # coverage; only the stdlib-vuln gate is 1.25.11-only.
        if: matrix.go == '1.25.11'
        run: |
          # Pin the gate tool itself (A2) — @latest would let the scanner drift,
          # making a green/red result non-reproducible across runs.
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          # Blocking on CALLED vulnerabilities (symbol scan). Uncalled module /
          # imported findings are report-only and must not wedge CI; -scan=symbol
          # is the default, the gate is the exit code on a called vuln.
          govulncheck ./...

  lint:
    name: Lint (golangci-lint v2.12.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache: true
      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
      - name: Generate FlatBuffers code
        run: make generate-fb
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          # Pinned to the repo-canonical version (matches Makefile GOLANGCI_LINT_VERSION)
          # so CI == local. The 4-milestone "dark lint" was this job floating `latest`
          # (which ran v1 against a v2 config) plus CI never triggering on the branch.
          version: v2.12.2
          args: --timeout=5m --issues-exit-code=1

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache: true
      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
      - name: Generate FlatBuffers code
        run: make generate-fb
      - name: Install bc
        run: sudo apt-get install -y bc
      - name: Generate focused coverage report
        run: make test-coverage-focused
      - name: Generate coverage report
        run: make coverage-report
      - name: Check coverage thresholds
        # Backed by the T7-fixed check_coverage.sh: a failing test suite now
        # exits non-zero (the swallow-bug is fixed) so this is a real gate.
        run: ./scripts/testing/check_coverage.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          # fail_ci_if_error stays false: a Codecov upload hiccup must not fail CI
          # (the real coverage gate is check_coverage.sh above, not the upload).
          fail_ci_if_error: false
      - name: Archive coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: |
            coverage-focused.txt
            coverage-focused.html

  fuzz:
    name: Fuzz (bounded discovery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache: true
      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
      - name: Generate FlatBuffers code
        run: make generate-fb
      - name: Fuzz FlatBuffersStore.Load (bounded)
        # Structural evidence artifact, NOT a Decision gate: a crash fails the job,
        # but "no crash found in 60s" is an existential non-finding, never a proof.
        # The durable gate is the committed seed-corpus replay in the race test job.
        run: go test ./pkg/workflow/ -run='^$' -fuzz='^FuzzFlatBuffersStoreLoad$' -fuzztime=60s

  formal:
    name: Formal models (TLC capstones, BLOCKING)
    runs-on: ubuntu-latest
    # AUD-046 / V-04 — the TLA+ specs were only ever run BY HAND, so they could
    # rot relative to the code with nothing to catch it. This model-checks the
    # load-bearing capstones (the level-executor safety+liveness proofs + the
    # durable crash-resume algorithm) on every PR against a PINNED tools jar
    # verified by SHA-256. It needs only a JRE — no Go build, no FlatBuffers.
    #
    # Scope is the "No error has been found" capstones, NOT the `*Break` mutation
    # configs (which INVERT the pass condition — TLC is expected to find a
    # violation there); grading those needs per-config expected-outcome metadata.
    # See scripts/formal/run_tlc.sh.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache pinned tla2tools.jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tlacache
          # Key on the pinned version so a jar bump busts the cache. The script
          # re-verifies the SHA-256 on every run regardless, so a poisoned cache
          # cannot slip a wrong jar past the gate.
          key: tla2tools-v1.8.0
      - name: Model-check TLC capstones
        run: ./scripts/formal/run_tlc.sh
      - name: Archive TLC state-count summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tlc-summary
          path: tlc-summary.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache: true
      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
      - name: Generate FlatBuffers code
        run: make generate-fb
      - name: Build
        run: go build -v ./...
      # This step runs every example's main() as a smoke gate. A compile gate cannot
      # see a runtime failure, so `go build` alone is insufficient; each example now
      # exits NON-ZERO on infrastructure failure and exit 0 on a demonstrated outcome
      # (a deliberate workflow failure the example is teaching is not an error) — so
      # this gate reds on broken wiring, not on a demonstration working.
      #
      # The new suite (M23+) is the 13 numbered dirs (01-hello-dag … 12-observability)
      # plus capstone-document-pipeline. Two need care and both are handled here:
      #   * 12-observability is a SEPARATE Go module (its own go.mod, replace back to
      #     the lib, pulls the OTel SDK). `go run` from the ROOT module fails for it, so
      #     it is run from INSIDE its own dir — the `(cd $dir && go run .)` below makes
      #     `go run .` resolve against that module.
      #   * 03-durable-crash-resume re-execs itself as a CHILD worker that self-kills
      #     (os.Exit(137)); the PARENT (the role `go run .` invokes here, with no role
      #     env set) captures that expected child exit, resumes off SQLite, and exits 0.
      #     capstone runs a longer multi-worker demo. A per-example `timeout` means a
      #     wedged example self-terminates (reporting failure) instead of running to the
      #     job's ceiling; `set -e` makes any non-zero example red the step (the prior
      #     loop had no `set -e`, so a mid-loop failure was masked unless it ran last).
      # Examples take no network and no external services; each writes durable state
      # under its own temp/dir.
      - name: Run examples
        run: |
          set -euo pipefail
          for example in $(find examples -name "main.go" -not -path "*/\.*" | sort); do
            dir=$(dirname "$example")
            echo "Running example: $dir"
            (cd "$dir" && timeout 300 go run .)
          done

  mutation:
    name: Mutation testing (informational, non-blocking)
    runs-on: ubuntu-latest
    # SCHEDULED / push-only, NOT every PR (AUD-050 / V-03). Mutation testing is the
    # rung above coverage% but is slow enough that a runaway run once hit GitHub's
    # 6h default job timeout and was CANCELLED, which surfaced the whole workflow as
    # cancelled even though every blocking job had passed. Two guards close that:
    #   * this `if` keeps it off the every-PR hot path — it runs on the nightly
    #     schedule and on pushes to the long-lived branches, where a slow run costs
    #     nobody a PR turnaround;
    #   * `timeout-minutes` below caps it FAR under the 6h default, so it self-
    #     terminates as a clean informational failure instead of a workflow-cancel.
    if: github.event_name == 'schedule' || github.event_name == 'push'
    # SAFETY BACKSTOP ONLY (48m). The real cap is the shell `timeout` on the gremlins
    # step below (38m). GitHub's `timeout-minutes` produces a CANCELLATION, and
    # continue-on-error neutralizes a FAILURE, not a cancellation — so relying on
    # timeout-minutes alone tainted the whole workflow rollup as `cancelled` on EVERY
    # run (the mutation suite always exceeds 40m). The shell timeout self-terminates
    # the step as a clean exit-0 instead, keeping the workflow green; this backstop is
    # set above the shell cap + setup so it only fires on a genuine hang.
    timeout-minutes: 48
    # NON-BLOCKING by design: too sensitive to equivalent-mutant churn to gate the
    # build on. continue-on-error makes the job report its result without ever
    # failing CI — it exists to surface NEW real test gaps over time (read the log,
    # don't trust the exit code). See docs/development/mutation_testing.md for the
    # accepted-survivor baseline + how to triage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache: true
      - name: Install FlatBuffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
      - name: Generate FlatBuffers code
        run: make generate-fb
      - name: Run go-gremlins (scoped to .gremlins.yaml)
        # gremlins is a DEV tool — pinned via `go run @v0.6.0`, NOT added to go.mod.
        # Two flags are load-bearing (see docs/development/mutation_testing.md):
        #   * config .gremlins.yaml scopes mutation to the 6 core files. Its
        #     exclude-files patterns are RELATIVE TO THE RUN TARGET (./pkg/workflow),
        #     e.g. "action.go" / "metrics/.*\.go" — NOT "pkg/workflow/action.go".
        #   * --timeout-coefficient 60: gremlins derives the per-mutant timeout
        #     from its ~1s coverage run, not the ~13s real suite (gopter property
        #     suites dominate). The default 3x times out EVERY mutant (false 0%);
        #     60x (~69s budget) clears the real suite.
        run: |
          # Shell-level timeout (38m) so the step self-terminates as a CLEAN exit-0
          # instead of GitHub cancelling the job at timeout-minutes — a cancellation
          # that continue-on-error cannot neutralize, which tainted the workflow rollup
          # as `cancelled` every run. This job is informational: read the log, not the
          # exit code — so any non-zero (the 38m budget via `timeout` -> 124, OR
          # surviving mutants) is surfaced as a notice and the step exits 0. The
          # workflow stays GREEN; new real test gaps are found by reading the log.
          timeout 2280 go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 \
            unleash --config .gremlins.yaml --timeout-coefficient 60 ./pkg/workflow || {
            ec=$?
            if [ "$ec" -eq 124 ]; then
              echo "::notice::mutation testing reached its 38m informational budget — partial results above (non-blocking)"
            else
              echo "::notice::gremlins exited ${ec} (informational, non-blocking) — read the log for surviving mutants"
            fi
          }
